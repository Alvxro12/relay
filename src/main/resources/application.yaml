spring:
  application:
    name: Relay

  rabbitmq:
    host: localhost
    port: 5673
    username: guest
    password: guest

  datasource:
    url: jdbc:sqlserver://localhost:14330;databaseName=relay;encrypt=true;trustServerCertificate=true
    username: "sa"
    password: "${DB_PASSWORD}"
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # El esquema lo versiona Flyway (src/main/resources/db/migration), no Hibernate.
  flyway:
    # La DB de dev ya tiene las tablas creadas por ddl-auto y los parches manuales.
    # baseline-on-migrate la marca en vez de fallar, y la marca en 1: el esquema que
    # ya tiene ES el de V1, así que V1 queda como aplicada y no se intenta correr.
    # Con baseline-version 0 quedaría en 0 y Flyway trataría de crear tablas que ya
    # existen. Una DB vacía no baselinea nunca —baseline-on-migrate solo aplica a un
    # esquema no vacío—, así que ahí V1 corre normalmente y crea todo desde cero.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      # validate, no update: Hibernate verifica que el esquema coincida con las
      # entidades pero no lo toca. Si esto falla, la migración no refleja el
      # esquema real y hay que corregir la migración —nunca bajar a `none`, que
      # apagaría justamente el chequeo que avisa del problema.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

relay:
  reconciliation:
    # Cuánto puede quedarse un pago en cada estado antes de contar como colgado. Un
    # umbral por estado porque los tres tardan cosas distintas por diseño: PROCESSING
    # dura lo que dura la llamada al proveedor (segundos), mientras que
    # AWAITING_CONFIRMATION espera un webhook que puede tardar horas sin que nada esté
    # mal. Medirlos con la misma vara haría sonar la alerta sobre el flujo feliz.
    # Formato de Duration de Spring: 30s, 2m, 6h.
    stale-after:
      unknown: 15m
      processing: 2m
      awaiting-confirmation: 6h

  webhook:
    # Secreto compartido con el proveedor para firmar los webhooks (HMAC-SHA256).
    # Nunca hardcodeado: viene del entorno, ver .env.example.
    secret: "${WEBHOOK_SECRET}"

  auth:
    jwt:
      # Clave HMAC en Base64, 256 bits. Sin default a proposito: si la variable no
      # esta, la app no arranca. Un default seria una clave publica en el repo con
      # la que cualquiera podria firmar tokens validos.
      secret: "${JWT_SECRET}"
      issuer: "relay"
      audience: "relay-api"
      # 15 minutos. Es el unico mecanismo de revocacion que hay: no se guarda estado
      # de sesion, asi que un token robado o un merchant deshabilitado dejan de
      # servir cuando el token expira, no antes.
      ttl: 15m

