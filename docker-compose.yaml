## Solo infraestructura. La aplicación se corre desde el IDE o con `mvn spring-boot:run`
## contra estos servicios; no se containeriza acá.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: relay-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: "Developer"
    ports:
      - "14330:1433"
    volumes:
      - relay-db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD}" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Crea la base `relay` y termina. Existe porque la imagen de SQL Server no tiene
  # ningún mecanismo de init scripts: no alcanza con montar un .sql en un directorio
  # —eso es de Postgres— y sin la base creada, la app no arranca. Antes la creaba
  # Hibernate con `ddl-auto: update`; con `validate` ya no crea nada.
  #
  # Espera el healthcheck de db porque SQL Server tarda en aceptar conexiones bastante
  # después de que el contenedor está corriendo. El script es idempotente, así que
  # volver a levantarlo no molesta.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: relay-db-init
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/init:/scripts:ro
    # Forma exec a propósito: sin shell de por medio no hay que preocuparse por el
    # quoting de una contraseña con caracteres especiales.
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -S
      - db
      - -U
      - sa
      - -P
      - ${DB_PASSWORD}
      - -C
      - -b
      - -i
      - /scripts/create-database.sql
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: relay-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - relay-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  relay-db-data:
  relay-rabbitmq-data:
